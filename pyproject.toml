[project]
name = "sdbp-review"
version = "0.1.0"
description = "本地行为模型、需求管理和代码 Review 工具"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0,<5",
    "starlette>=0.52.1,<1",
    "uvicorn>=0.41.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.15.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
